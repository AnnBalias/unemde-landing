<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UNEMDE — become a partner</title>
  <meta name="description" content="Partner benefits and an application form for venues." />
  <link rel="icon" href="assets/icon.png" />
  <meta name="theme-color" content="#1F3053" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="partner" data-title-key="meta.partnerTitle" data-desc-key="meta.partnerDescription">
  <div id="site-header"></div>
  <main>
    <section class="page-hero">
      <div class="wrap">
        <p class="kicker" data-i18n="partner.kicker">Become a Partner</p>
        <h1 data-i18n="partner.title">Зрощуй заклад разом з UNEMDE</h1>
        <p class="lead" data-i18n="partner.sub"></p>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <p class="kicker" data-i18n="partner.why"></p>
        <h2 data-i18n="partner.whySub"></h2>
        <div class="benefits light">
          <article class="benefit" data-aos="fade-up"><h3 data-i18n="partner.v1t"></h3><p data-i18n="partner.v1p"></p></article>
          <article class="benefit" data-aos="fade-up" data-aos-delay="80"><h3 data-i18n="partner.v2t"></h3><p data-i18n="partner.v2p"></p></article>
          <article class="benefit" data-aos="fade-up" data-aos-delay="160"><h3 data-i18n="partner.v3t"></h3><p data-i18n="partner.v3p"></p></article>
          <article class="benefit" data-aos="fade-up" data-aos-delay="240"><h3 data-i18n="partner.v4t"></h3><p data-i18n="partner.v4p"></p></article>
        </div>
      </div>
    </section>

    <section class="section soft">
      <div class="wrap">
        <p class="kicker" data-i18n="partner.reach"></p>
        <h2 data-i18n="partner.reachSub"></h2>
        <div class="cities" data-aos="fade-up">
          <div class="city"><b>142</b><span>Praha</span></div>
          <div class="city"><b>87</b><span>Brno</span></div>
          <div class="city"><b>45</b><span>Ostrava</span></div>
          <div class="city"><b>63</b><span>Bratislava</span></div>
          <div class="city"><b>31</b><span>Plzeň</span></div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="wrap partner-grid">
        <div class="partner-stats" data-aos="fade-right">
          <h2 data-i18n="partner.formTitle"></h2>
          <p class="sub" data-i18n="partner.formSub"></p>
          <div class="stats stats-compact">
            <div class="stat"><b data-i18n="partner.s1n">368+</b><span data-i18n="partner.s1t"></span></div>
            <div class="stat"><b data-i18n="partner.s2n">50k+</b><span data-i18n="partner.s2t"></span></div>
            <div class="stat"><b data-i18n="partner.s3n">4.8★</b><span data-i18n="partner.s3t"></span></div>
          </div>
        </div>
        <form class="partner-form" id="partnerForm" data-aos="fade-left">
          <label><span data-i18n="partner.name"></span><input name="name" type="text" required /></label>
          <label><span data-i18n="partner.email"></span><input name="email" type="email" required /></label>
          <label><span data-i18n="partner.phone"></span><input name="phone" type="tel" /></label>
          <label>
            <span data-i18n="partner.category"></span>
            <select name="category" required>
              <option value="" data-i18n="partner.catPlaceholder"></option>
              <option value="partnership" data-i18n="partner.catPartnership"></option>
              <option value="support" data-i18n="partner.catSupport"></option>
              <option value="press" data-i18n="partner.catPress"></option>
              <option value="other" data-i18n="partner.catOther"></option>
            </select>
          </label>
          <label><span data-i18n="partner.message"></span><textarea name="message" rows="4" required></textarea></label>
          <label><span data-i18n="partner.date"></span><input name="date" type="date" /></label>
          <label class="check-row"><input name="terms" type="checkbox" required /><span data-i18n="partner.terms"></span></label>
          <button class="btn btn-primary" type="submit" data-i18n="partner.send"></button>
          <p class="form-ok" id="partnerOk" hidden data-i18n="partner.success"></p>
        </form>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
