<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UNEMDE — FAQ</title>
  <meta name="description" content="Answers about deals, accounts, and UNEMDE partnership." />
  <link rel="icon" href="assets/icon.png" />
  <meta name="theme-color" content="#1F3053" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="faq" data-title-key="meta.faqTitle" data-desc-key="meta.faqDescription">
  <div id="site-header"></div>
  <main>
    <section class="page-hero">

        </div>
        <div class="faq-list" data-aos="fade-up">
          <article class="faq-item" data-cat="general"><button type="button"><span data-i18n="faq.q1"></span><i>+</i></button><p data-i18n="faq.a1"></p></article>

          <article class="faq-item" data-cat="deals"><button type="button"><span data-i18n="faq.q7"></span><i>+</i></button><p data-i18n="faq.a7"></p></article>
          <article class="faq-item" data-cat="account"><button type="button"><span data-i18n="faq.q8"></span><i>+</i></button><p data-i18n="faq.a8"></p></article>

          <article class="faq-item" data-cat="partners"><button type="button"><span data-i18n="faq.q11"></span><i>+</i></button><p data-i18n="faq.a11"></p></article>
          <article class="faq-item" data-cat="partners"><button type="button"><span data-i18n="faq.q12"></span><i>+</i></button><p data-i18n="faq.a12"></p></article>

          <p data-i18n="faq.moreSub"></p>
          <a class="btn btn-primary" href="partner.html" data-i18n="faq.moreCta"></a>
