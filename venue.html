<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UNEMDE Business for venues</title>
  <meta name="description" content="Storefront, deals, QR scanner, and booking calendar for cafés and restaurants." />
  <link rel="icon" href="assets/icon.png" />
  <meta name="theme-color" content="#1F3053" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="venue" data-title-key="meta.venueTitle" data-desc-key="meta.venueDescription">
  <div id="site-header"></div>
  <main>
    <section class="page-hero">
      <div class="wrap">
        <p class="kicker" data-i18n="biz.kicker">UNEMDE Business</p>
        <h1 data-i18n="biz.title">Каса, календар і акції — в одному додатку закладу</h1>
        <p class="lead" data-i18n="biz.sub"></p>
        <div class="hero-cta">
          <a class="btn btn-on-dark" href="#stores" data-i18n="apps.bCta">UNEMDE Business</a>
          <a class="btn btn-ghost" href="partner.html" data-i18n="home.partnerCta">Стати партнером</a>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="wrap split">
        <div data-aos="fade-right">
          <div class="feature-list">
            <div class="feature"><div class="icon-box">✎</div><div><h3 data-i18n="biz.f1t"></h3><p data-i18n="biz.f1p"></p></div></div>
            <div class="feature"><div class="icon-box">▣</div><div><h3 data-i18n="biz.f2t"></h3><p data-i18n="biz.f2p"></p></div></div>
            <div class="feature"><div class="icon-box">▦</div><div><h3 data-i18n="biz.f3t"></h3><p data-i18n="biz.f3p"></p></div></div>
          </div>
        </div>
        <div class="phones phones-inline" aria-hidden="true">
          <div class="phone-motion phone-a" data-aos="fade-up">
            <div class="phone"><div class="phone-screen"><img class="shot" src="assets/imgs/unemde-business/ub-restaurantdetails-l.jpg" alt="" /></div></div>
          </div>
          <div class="phone-motion phone-b" data-aos="fade-up" data-aos-delay="140">
            <div class="phone"><div class="phone-screen"><img class="shot" src="assets/imgs/unemde-business/ub-bookingcalendar-l.jpg" alt="" /></div></div>
          </div>
        </div>
      </div>
    </section>

    <section class="section soft">
      <div class="wrap">
        <div class="shot-row">
          <figure class="shot-card" data-aos="zoom-in"><img src="assets/imgs/unemde-business/ub-scanner-l.jpg" alt="" /><figcaption data-i18n="shots.scanner"></figcaption></figure>
          <figure class="shot-card" data-aos="zoom-in" data-aos-delay="80"><img src="assets/imgs/unemde-business/ub-restaurantdetails-l.jpg" alt="" /><figcaption data-i18n="shots.edit"></figcaption></figure>
          <figure class="shot-card" data-aos="zoom-in" data-aos-delay="160"><img src="assets/imgs/unemde-business/ub-bookingcalendar-l.jpg" alt="" /><figcaption data-i18n="shots.calendar"></figcaption></figure>
          <figure class="shot-card" data-aos="zoom-in" data-aos-delay="240"><img src="assets/imgs/unemde-business/ub-loadscreen.jpg" alt="" /><figcaption>UNEMDE Business</figcaption></figure>
        </div>
        <div class="stats">
          <div class="stat" data-aos="fade-up"><b>QR</b><span data-i18n="biz.st1"></span></div>
          <div class="stat" data-aos="fade-up" data-aos-delay="80"><b>1+1</b><span data-i18n="biz.st2"></span></div>
          <div class="stat" data-aos="fade-up" data-aos-delay="160"><b>CZK</b><span data-i18n="biz.st3"></span></div>
        </div>
        <ul class="check-list" data-aos="fade-up">
          <li><span class="check">✓</span> <span data-i18n="apps.b1"></span></li>
          <li><span class="check">✓</span> <span data-i18n="apps.b2"></span></li>
          <li><span class="check">✓</span> <span data-i18n="apps.b3"></span></li>
        </ul>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
