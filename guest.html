<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UNEMDE for guests</title>
  <meta name="description" content="Find deals nearby, book a slot, and activate the discount in 30 minutes." />
  <link rel="icon" href="assets/icon.png" />
  <meta name="theme-color" content="#1F3053" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="guest" data-title-key="meta.guestTitle" data-desc-key="meta.guestDescription">
  <div id="site-header"></div>
  <main>
    <section class="page-hero">
      <div class="wrap">
        <p class="kicker" data-i18n="guest.kicker">UNEMDE для гостей</p>
        <h1 data-i18n="guest.title">Локальні акції, які реально можна встигнути</h1>
        <p class="lead" data-i18n="guest.sub"></p>
        <a class="btn btn-on-dark" href="#stores" data-i18n="apps.gCta">UNEMDE для iOS і Android</a>
      </div>
    </section>

    <section class="section">
      <div class="wrap split">
        <div data-aos="fade-right">
          <p class="kicker" data-i18n="how.kicker">Як це працює</p>
          <h2 data-i18n="how.title"></h2>
          <div class="feature-list">
            <div class="feature"><div class="icon-box">1</div><div><h3 data-i18n="how.s1t"></h3><p data-i18n="how.s1p"></p></div></div>
            <div class="feature"><div class="icon-box">2</div><div><h3 data-i18n="how.s2t"></h3><p data-i18n="how.s2p"></p></div></div>
            <div class="feature"><div class="icon-box">3</div><div><h3 data-i18n="how.s3t"></h3><p data-i18n="how.s3p"></p></div></div>
            <div class="feature"><div class="icon-box">4</div><div><h3 data-i18n="how.s4t"></h3><p data-i18n="how.s4p"></p></div></div>
          </div>
        </div>
        <div class="phones phones-inline" aria-hidden="true">
          <div class="phone-motion phone-a" data-aos="fade-up">
            <div class="phone"><div class="phone-screen"><img class="shot" src="assets/imgs/unemde/u-mydeals-l.jpg" alt="" /></div></div>
          </div>
          <div class="phone-motion phone-b" data-aos="fade-up" data-aos-delay="140">
            <div class="phone"><div class="phone-screen"><img class="shot" src="assets/imgs/unemde/u-restaurantpage-l.jpg" alt="" /></div></div>
          </div>
        </div>
      </div>
    </section>

    <section class="section soft">
      <div class="wrap">
        <div class="feature-list feature-grid">
          <div class="feature" data-aos="fade-up"><div class="icon-box">📍</div><div><h3 data-i18n="guest.f1t"></h3><p data-i18n="guest.f1p"></p></div></div>
          <div class="feature" data-aos="fade-up" data-aos-delay="80"><div class="icon-box">🎫</div><div><h3 data-i18n="guest.f2t"></h3><p data-i18n="guest.f2p"></p></div></div>
          <div class="feature" data-aos="fade-up" data-aos-delay="160"><div class="icon-box">♡</div><div><h3 data-i18n="guest.f3t"></h3><p data-i18n="guest.f3p"></p></div></div>
        </div>
        <div class="shot-row">
          <figure class="shot-card" data-aos="zoom-in"><img src="assets/imgs/unemde/u-mainpage-l.jpg" alt="" /><figcaption data-i18n="shots.discover">Discover</figcaption></figure>
          <figure class="shot-card" data-aos="zoom-in" data-aos-delay="80"><img src="assets/imgs/unemde/u-restaurantpage-l.jpg" alt="" /><figcaption data-i18n="shots.venue"></figcaption></figure>
          <figure class="shot-card" data-aos="zoom-in" data-aos-delay="160"><img src="assets/imgs/unemde/u-mydeals-l.jpg" alt="" /><figcaption data-i18n="shots.deals"></figcaption></figure>
          <figure class="shot-card" data-aos="zoom-in" data-aos-delay="240"><img src="assets/imgs/unemde/u-mainpage-d.jpg" alt="" /><figcaption>Dark</figcaption></figure>
        </div>
        <ul class="check-list" data-aos="fade-up">
          <li><span class="check">✓</span> <span data-i18n="apps.g1"></span></li>
          <li><span class="check">✓</span> <span data-i18n="apps.g2"></span></li>
          <li><span class="check">✓</span> <span data-i18n="apps.g3"></span></li>
        </ul>
        <div class="section-cta">
          <a class="btn btn-primary" href="#stores" data-i18n="apps.gCta"></a>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
